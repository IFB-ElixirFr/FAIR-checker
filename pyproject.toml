[project]
name = "fair-checker"
version = "1.3.2"
description = "FAIR-Checker is a tool aimed at assessing FAIR principles and empowering data provider to enhance the quality of their digital resources. Data providers and consumers can check how FAIR are web resources. Developers can explore and inspect metadata exposed in web resources."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Thomas Rosnet" },
    { name = "Alban Gaignard" },
    { name = "Marie-Dominique Devignes" },
    { name = "Sahar Frikha" },
    { name = "Brieuc Quemeneur" },
]
requires-python = ">=3.9,<4.0"

dependencies = [
    # Web framework
    "gunicorn==20.1.0",
    "Flask>=3.0,<4.0",
    "Werkzeug>=3.0,<4.0",
    "Flask-Cors>=5.0,<6.0",
    "Flask-SocketIO>=5.3,<6.0",
    "Flask-Caching>=2.3,<3.0",
    "flask-restx>=1.3,<2.0",
    "flask-swagger-ui>=4.11.1",
    # Semantic Web / RDF
    "rdflib==7.1.3",
    "pyshacl~=0.25.0",
    "SPARQLWrapper==1.8.5",
    # Scraping / browser automation
    "lxml==5.1.0",
    "extruct==0.13.0",
    # Data / utilities
    "numpy>=1.21",
    "cachetools==5.0.0",
    "rich==10.12.0",
    "tqdm==4.62.3",
    "termcolor==1.1.0",
    "validators==0.18.2",
    "python-dotenv==0.19.1",
    "PyYAML>=6.0.2",
    "APScheduler>=3.11.0",
    "gitpython>=3.1.44",
    # Database
    "pymongo==3.11.0",
    # Python 3.12 compatibility overrides
    "dnspython>=2.0.0",
    "diskcache (>=5.6.3,<6.0.0)",
    "playwright (>=1.58.0,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "6.2.5"
coverage = "6.2"
flake8 = "^7.0"

[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-rtd-theme = ">=3.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
