# Runs the unit test suite. Dependencies are installed with Poetry from pyproject.toml / poetry.lock,
# the same way as for a local or production installation (see the README).

name: Unit testing

on:
  workflow_dispatch:
  push:
    branches: [dev_alban, dev_thomas, master, pre_deploy_1.1]
  pull_request:
    branches: [dev_alban, dev_thomas, master, pre_deploy_1.1]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Optional credentials read by config.py / profiles: they avoid GitHub API rate limits
      # and enable the BioPortal checks. When the BIOPORTAL_APIKEY secret is not defined it is just empty.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BIOPORTAL_APIKEY: ${{ secrets.BIOPORTAL_APIKEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install "poetry>=2.1,<3"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # poetry.lock is not tracked in git (see .gitignore): Poetry resolves the dependencies from
      # pyproject.toml at each run. Only the downloaded packages are cached, keyed on pyproject.toml.
      - name: Cache Poetry downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: poetry-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --no-interaction --without docs

      - name: Install Playwright browser
        run: poetry run playwright install --with-deps chromium

      - name: Create mongoDB Docker container
        run: sudo docker run -d -p 27017:27017 mongo:latest

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run tests
        run: |
          poetry run coverage run --omit '.venv/*' -m pytest tests
          poetry run coverage report -m
