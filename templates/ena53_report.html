<script type="text/javascript" charset="utf-8">

    function validation_ena53_report(data) {
        console.log("Generating ENA53 validation report");
        console.log(data);

        const valid_container = document.getElementById("block_ena53_valid_report");
        valid_container.innerHTML = "";
        const hvalid_template = document.getElementById('head-ena53-valid-template').innerHTML;
        const tvalids_template = document.getElementById("tables-ena53-valid-template").innerHTML;
        const rvalid_template = document.getElementById("row-ena53-valid-template").innerHTML;

        var index = 0;
        $.each(data, function (key, value) {
            console.log("Processing resource: " + key);
            index++;
            var str_index = index.toString();
            var resource = key;
            var type = data[key]['type'];
            var profile = data[key]['ref_profile'];
            var conforms = data[key]['conforms'];
            var completeness_score = data[key]['completeness_score'];

            // Validation report head
            var hvalid_rendered = Mustache.render(hvalid_template, {
                resource: resource,
                type: type,
                profile: profile,
                completeness_score: completeness_score,
            });
            valid_container.innerHTML += hvalid_rendered;

            // Required/recommended results tables
            var trequi_index = str_index + "-ena53-requi-tbody";
            var treco_index = str_index + "-ena53-reco-tbody";
            var trinfo_index = str_index + "-ena53-info-tbody";
            var table_rendered = Mustache.render(tvalids_template, {
                resource: resource,
                conforms: conforms,
                index_requi: trequi_index,
                index_reco: treco_index,
                index_info: trinfo_index,
            });
            valid_container.innerHTML += table_rendered;

            // Required (errors) rows
            var tmiss_body_container = document.getElementById(trequi_index);
            $.each(data[key]['errors'], function (index, item) {
                let row_rendered = Mustache.render(rvalid_template, {
                    item: item,
                    css_class: "has-text-danger has-text-weight-bold",
                    text: "must be",
                });
                tmiss_body_container.innerHTML += row_rendered;
            });

            // Recommended (warnings) rows
            var treco_body_container = document.getElementById(treco_index);
            $.each(data[key]['warnings'], function (index, item) {
                let row_rendered = Mustache.render(rvalid_template, {
                    item: item,
                    css_class: "has-text-warning has-text-weight-bold",
                    text: "should be",
                });
                treco_body_container.innerHTML += row_rendered;
            });

            // Optional (infos) rows
            var trinfo_body_container = document.getElementById(trinfo_index);
            $.each(data[key]['infos'], function (index, item) {
                let row_rendered = Mustache.render(rvalid_template, {
                    item: item,
                    css_class: "has-text-info",
                    text: "could be",
                });
                trinfo_body_container.innerHTML += row_rendered;
            });

        });
    };


</script>


<!-- Template: validation header -->
<script id="head-ena53-valid-template" type="text/html">
    <hr>
    <div class="has-text-centered" style="margin: 1.5rem 0 2rem 0;">
        <p class="heading"
           style="font-size: 1rem; letter-spacing: 0.1em; text-transform: uppercase; color: #888; margin-bottom: 0.4rem;">
            Evaluated resource</p>
        <p style="margin-bottom: 1.25rem;">
            <a href="{% raw %}{{resource}}{% endraw %}" target="_blank"
               style="font-size: 0.95rem; word-break: break-all;">{% raw %}{{resource}}{% endraw %}</a>
        </p>
        <p class="heading"
           style="font-size: 1rem; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 0.25rem;">
            Completeness Score</p>
        <p class="title" style="font-size: 4rem; font-weight: 800; line-height: 1; color: #363636;">
            {% raw %}{{completeness_score}}{% endraw %}<span style="font-size: 2rem;">%</span>
        </p>
        <p class="help" style="font-size: 0.95rem; color: #666; margin-top: 0.5rem;">
            Weighted score: required properties count 3×, recommended 2×, optional 1× &mdash; measuring how many ENA
            Checklist 53 properties are actually provided.
        </p>
    </div>
</script>


<!-- Template: required / recommended / optional tables -->
<script id="tables-ena53-valid-template" type="text/html">
    <div class="columns is-multiline is-mobile">
        <div class="column is-one-third">
            <table class="table is-striped is-fullwidth">
                <thead>
                <tr>
                    <th>Required missing properties</th>
                </tr>
                </thead>
                <tbody id="{% raw %}{{index_requi}}{% endraw %}"></tbody>
            </table>
            {% raw %}
                {{ #conforms }}
                <p>
                    <span class="has-text-success has-text-weight-bold">All required properties are present.</span>
                </p>
                {{ /conforms }}
            {% endraw %}
        </div>
        <div class="column is-one-third">
            <table class="table is-striped is-fullwidth">
                <thead>
                <tr>
                    <th>Recommended missing properties</th>
                </tr>
                </thead>
                <tbody id="{% raw %}{{index_reco}}{% endraw %}"></tbody>
            </table>
        </div>
        <div class="column is-one-third">
            <table class="table is-striped is-fullwidth">
                <thead>
                <tr>
                    <th>Optional missing properties</th>
                </tr>
                </thead>
                <tbody id="{% raw %}{{index_info}}{% endraw %}"></tbody>
            </table>
        </div>
    </div>
</script>


<!-- Template: one row per missing property -->
<script id="row-ena53-valid-template" type="text/html">
    <tr>
        <td>
            <span class="tag is-light"><code>{% raw %}{{item}}{% endraw %}</code></span>
            <span class="{% raw %}{{css_class}}{% endraw %}">{% raw %}{{text}}{% endraw %}</span>
            provided
        </td>
    </tr>
</script>


<div id="block_ena53_valid_report" class="block is-hidden">
</div>
