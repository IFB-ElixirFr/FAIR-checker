services:

  nginx:
    image: nginx:1.31-alpine
    container_name: fc-nginx
    ports:
      - ${NGINX_HTTP_PORT}:80
      - ${NGINX_HTTPS_PORT}:443
    environment:
      - API_BASEPATH=${API_BASEPATH}
    volumes:
      - ./nginx-config/nginx.conf:etc/nginx/nginx.conf
      - ./nginx-config/certificates:/etc/nginx/certs
    depends_on:
      - api
      - web
    networks:
      - services

  api:
    build: ./src/api
    container_name: fair-checker-api
    environment:
      - IS_DEV=${IS_DEV}
      - HTTP=${HTTP}
      - API_HOST=${API_HOST}
      - API_BASEPATH=${API_BASEPATH}
      - API_PORT=${API_PORT}
      - API_ADMIN_USERNAME=${API_ADMIN_USERNAME}
      - API_ADMIN_PASSWORD=${API_ADMIN_PASSWORD}
      - GRAPH_SERVER_HOST=${GRAPH_SERVER_HOST}
      - GRAPH_SERVER_PORT=${GRAPH_SERVER_PORT}
    volumes:
      - ./src/api/src:/api/src
    ports:
      - 5000:5000
    networks:
      - services
      - graph


  web:
    container_name: fair-checker-webapp
    build: 
      context: ./src/web
      args:
        - HTTP=${HTTP}
        - HOST_URL=${HOST_URL}
        - GRAPH_SERVER_HOST=${GRAPH_SERVER_HOST}
        - API_HOST=${API_HOST}
        - API_PORT=${API_PORT}
        - API_BASEPATH=${API_BASEPATH}
    ports:
      - 3001:3000
    networks:
      - services
  
  db:
    image: mongo:8.3.7-noble
    container_name: fair-checker-database
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    volumes:
      - ./data:/data/db
    ports:
      - 27017:27017